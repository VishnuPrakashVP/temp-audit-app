<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>Temperature Audit</title>
  <script>
    // Runs before the CSS loads so the page never flashes the wrong theme.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="top-bar-title">
        <h1>Temperature Audit</h1>
        <p id="audit-info" class="audit-info" hidden></p>
      </div>
      <p id="progress-text" class="progress-text" role="status" aria-live="polite" hidden></p>
      <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Switch to dark mode">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      </button>
    </div>
    <div id="progress-track" class="progress-track" role="progressbar"
         aria-label="Audit progress" aria-valuemin="0" hidden>
      <div id="progress-bar" class="progress-bar"></div>
    </div>
  </header>

  <main>
    <section id="start-panel" class="card">
      <label for="checked-by">Checked by</label>
      <input id="checked-by" type="text" autocomplete="name" placeholder="Your name">
      <button id="start" type="button" class="action">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        Start audit
      </button>
    </section>

    <section id="audit-panel" hidden>
      <div id="checklist"></div>
      <button id="submit" type="button" class="action" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        <span id="submit-label">Submit audit</span>
      </button>
    </section>

    <div id="message" class="message" role="status" aria-live="polite" hidden></div>

    <section class="history-section">
      <h2 class="section-label">Today's audits</h2>
      <div id="history-filter" class="chips" role="radiogroup" aria-label="Filter by department">
        <label class="chip">
          <input type="radio" name="history-department" value="" checked>
          <span>All</span>
        </label>
      </div>
      <ul id="history" class="history"></ul>
      <p id="history-empty" class="empty" hidden>No audits yet today.</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
